# Builds the portable program on a real Windows machine, checks it there and
# publishes the zip as the "portable-latest" release, so the user downloads it
# from GitHub with one link instead of passing a 54 MB file around.
name: Портативная сборка для Windows

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "portable/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/build-portable.yml"
      - ".github/release-notes.md"
      - "LICENSE"
  # Dependabot's pull requests (newer actions) are built and checked before
  # they are merged; nothing is published from a pull request.
  pull_request:
    paths:
      - ".github/workflows/build-portable.yml"
  workflow_dispatch:

permissions:
  contents: write

# One publishing build at a time: two merges in a row used to run side by
# side and collide on the release (HTTP 403 while the other one recreated it).
# A newer waiting run replaces an older waiting one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Собрать программу
        run: python tools/build_portable.py --out dist

      - name: Распаковать zip в папку с русским именем и проверить встроенный Python
        shell: pwsh
        run: |
          $dest = Join-Path $env:USERPROFILE "Downloads\Проверка распаковки"
          Expand-Archive dist\ArticleDownloader_Portable.zip -DestinationPath $dest -Force
          $app = Join-Path $dest "ArticleDownloader"
          if (-not (Test-Path (Join-Path $app "ЛИЦЕНЗИЯ.txt"))) { throw "в архиве нет ЛИЦЕНЗИЯ.txt" }
          $py = Join-Path $app "python\python.exe"
          & $py -E -s -X utf8 -c "import playwright, psutil, pypdf, greenlet, ssl, sqlite3; print('встроенный Python: всё на месте')"
          if ($LASTEXITCODE) { throw "встроенный Python не запустился" }
          & $py -E -s -X utf8 tests\parse_test.py (Join-Path $app "scripts")
          if ($LASTEXITCODE) { throw "parse_test" }
          & $py -E -s -X utf8 tests\search_test.py (Join-Path $app "scripts")
          if ($LASTEXITCODE) { throw "search_test" }
          & $py -E -s -X utf8 tests\review_test.py (Join-Path $app "scripts")
          if ($LASTEXITCODE) { throw "review_test" }
          & $py -E -s -X utf8 tests\donate_test.py (Join-Path $app "scripts")
          if ($LASTEXITCODE) { throw "donate_test: адрес или ссылка для донатов не прошли проверку" }
          & $py -E -s -X utf8 tests\support_test.py (Join-Path $app "scripts")
          if ($LASTEXITCODE) { throw "support_test" }
          & $py -E -s -X utf8 tests\i18n_test.py (Join-Path $app "scripts")
          if ($LASTEXITCODE) { throw "i18n_test: на английской странице остался русский текст" }
          & $py -E -s -X utf8 tests\download_stats_test.py
          if ($LASTEXITCODE) { throw "download_stats_test" }
          "APP=$app" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Запустить программу через «СКАЧАТЬ СТАТЬИ.bat»
        shell: pwsh
        run: |
          $env:ARTICLE_UI_NO_WINDOW = "1"
          # Not the real version.json: a test start must not count as a launch.
          $env:ARTICLE_UPDATE_URL = "http://127.0.0.1:9/version.json"
          $bat = Join-Path $env:APP "СКАЧАТЬ СТАТЬИ.bat"
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "`"$bat`""
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { $ping = Invoke-RestMethod http://127.0.0.1:17865/api/ping; $ok = $ping.app -eq "ArticleDownloader"; if ($ok) { break } } catch {}
          }
          if (-not $ok) { Get-Content (Join-Path $env:APP "logs\app.log") -ErrorAction SilentlyContinue; throw "окно программы не ответило" }
          $tok = Get-Content (Join-Path $env:APP "logs\.ui_token")
          $state = Invoke-RestMethod -Headers @{ "X-Token" = $tok } "http://127.0.0.1:17865/api/state?v=0"
          "Программа отвечает. Браузер: $($state.browser.title) $($state.browser.error)"
          $inbox = Invoke-RestMethod -Headers @{ "X-Token" = $tok } "http://127.0.0.1:17865/api/inbox"
          "Папка inbox: $($inbox.inbox)"
          Invoke-RestMethod -Method Post -Headers @{ "X-Token" = $tok } -ContentType "application/json" -Body "{}" http://127.0.0.1:17865/api/quit | Out-Null

      - name: Автообновление (этот же архив под видом версии 99.0)
        shell: pwsh
        run: |
          $site = Join-Path $env:RUNNER_TEMP "update-site"
          New-Item -ItemType Directory -Force $site | Out-Null
          Copy-Item dist\ArticleDownloader_Portable.zip $site
          $hash = (Get-FileHash dist\ArticleDownloader_Portable.zip -Algorithm SHA256).Hash.ToLower()
          @{ version = "99.0"; sha256 = $hash; zip = "http://127.0.0.1:8765/ArticleDownloader_Portable.zip" } |
            ConvertTo-Json | Set-Content (Join-Path $site "version.json") -Encoding utf8
          $web = Start-Process -FilePath python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", $site -PassThru -WindowStyle Hidden
          # The file comes back only if the update really copies the new files over the program.
          $marker = Join-Path $env:APP "HOW TO USE.txt"
          Remove-Item $marker
          $env:ARTICLE_UI_NO_WINDOW = "1"
          $env:ARTICLE_UPDATE_URL = "http://127.0.0.1:8765/version.json"
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "`"$(Join-Path $env:APP 'СКАЧАТЬ СТАТЬИ.bat')`""
          foreach ($i in 1..30) { Start-Sleep 2; try { if ((Invoke-RestMethod http://127.0.0.1:17865/api/ping).app) { break } } catch {} }
          $h = @{ "X-Token" = (Get-Content (Join-Path $env:APP "logs\.ui_token")) }
          foreach ($i in 1..20) { Start-Sleep 1; $s = Invoke-RestMethod -Headers $h "http://127.0.0.1:17865/api/state?v=0"; if ($s.update.newer) { break } }
          "Программа видит версию: $($s.update.latest) (новее: $($s.update.newer))"
          if (-not $s.update.newer) { throw "программа не увидела новую версию" }
          Invoke-RestMethod -Method Post -Headers $h -ContentType "application/json" -Body "{}" http://127.0.0.1:17865/api/update_now | Out-Null
          $updateLog = Join-Path $env:APP "logs\update.log"
          $back = $false
          foreach ($i in 1..90) {
            Start-Sleep 2
            $log = Get-Content $updateLog -Raw -ErrorAction SilentlyContinue
            if ($log -match "program started again" -and (Test-Path $marker)) {
              try { if ((Invoke-RestMethod http://127.0.0.1:17865/api/ping).app) { $back = $true; break } } catch {}
            }
          }
          Get-Content $updateLog -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:APP "logs\app.log") -Tail 12 -ErrorAction SilentlyContinue
          if (-not $back -or ((Get-Content $updateLog -Raw) -notmatch "updated \(robocopy")) { throw "автообновление не прошло" }
          "Автообновление прошло: файлы заменены, программа открылась снова"
          $h = @{ "X-Token" = (Get-Content (Join-Path $env:APP "logs\.ui_token")) }
          Invoke-RestMethod -Method Post -Headers $h -ContentType "application/json" -Body "{}" http://127.0.0.1:17865/api/quit | Out-Null
          Stop-Process -Id $web.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep 3

      - name: Проба браузера загрузчика (Edge) и разогрева баз
        continue-on-error: true
        shell: pwsh
        run: |
          $py = Join-Path $env:APP "python\python.exe"
          $dl = Join-Path $env:APP "scripts\article_downloader.py"
          $env:ARTICLE_BROWSER = "edge"
          $env:ARTICLE_PROFILE_DIR = Join-Path $env:RUNNER_TEMP "edge-profile"
          & $py -E -s -X utf8 $dl --open "https://example.com/"
          (Invoke-RestMethod http://127.0.0.1:9223/json/version).Browser
          $bases = '[{"key":"elsevier","url":"https://www.sciencedirect.com/"},{"key":"mdpi","url":"https://www.mdpi.com/"},{"key":"springer","url":"https://link.springer.com/"}]'
          $file = Join-Path $env:RUNNER_TEMP "bases.json"
          Set-Content -Path $file -Value $bases -Encoding utf8
          $env:ARTICLE_JOB_DEADLINE = [string]([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + 90)
          & $py -E -s -X utf8 $dl --warmup $file
          "warm-up exit code: $LASTEXITCODE (0 = базы открылись без капчи, 10 = капча осталась)"
          & $py -E -s -X utf8 $dl --restart-browser

      - name: Проба настоящих API (неверный ключ Scopus / WoS, поиск OpenAlex)
        continue-on-error: true
        shell: pwsh
        run: |
          $py = Join-Path $env:APP "python\python.exe"
          & $py -E -s -X utf8 tests\api_probe.py (Join-Path $env:APP "scripts")

      - name: Выложить zip на страницу Releases
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "portable-latest"
          python tools/release_notes.py dist\ArticleDownloader_Portable.zip dist\release-notes.md
          if ($LASTEXITCODE) { throw "release_notes" }
          # The counters of the release about to be deleted go into the
          # "download-stats" page first (statistics never stop the release).
          python tools/download_stats.py
          $global:LASTEXITCODE = 0
          gh release delete $tag --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          $ver = Get-Content dist\version.txt
          gh release create $tag dist\ArticleDownloader_Portable.zip dist\version.json `
            --target $env:GITHUB_SHA `
            --title "Загрузчик статей $ver — готовая программа для Windows" `
            --notes-file dist\release-notes.md `
            --latest
          if ($LASTEXITCODE) { throw "release" }
          python tools/download_stats.py
          $global:LASTEXITCODE = 0
